<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>In Full Tale</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #07050b; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #frame { position: relative; }
  canvas { display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
  #ui { position: absolute; inset: 0; pointer-events: none; font-family: Georgia, 'Times New Roman', serif; color: #f1e2c0; }
  #ui > * { pointer-events: auto; }
  #ui { font-size: calc(var(--s, 2) * 5.2px); }
  .card { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(7, 5, 11, 0.72); }
  .card-in { width: 74%; max-height: 88%; box-sizing: border-box; padding: 2.2em 2.6em 1.4em; text-align: center; background: linear-gradient(#1b1320, #120d18);
    border: 1px solid #c98b3f; outline: 1px solid #3a2a20; outline-offset: 3px; box-shadow: 0 0 4em rgba(255, 170, 80, 0.16); }
  .card .orn { height: 1px; width: 40%; margin: 0 auto 1.4em; background: linear-gradient(90deg, transparent, #ffd680, transparent); }
  .card p { margin: 0 0 0.8em; line-height: 1.45; }
  .card .verse-text { font-size: 1.5em; font-style: italic; color: #f6ead0; }
  .card .verse-text.small { font-size: 1.3em; }
  .card .verse-ref { font-size: 1.05em; letter-spacing: 0.12em; text-transform: uppercase; color: #ffd680; }
  .card h2 { margin: 0 0 0.5em; font-size: 2em; font-weight: normal; letter-spacing: 0.08em; color: #ffd680; }
  .card .kicker { font-size: 1em; letter-spacing: 0.2em; text-transform: uppercase; color: #c98b3f; margin-bottom: 0.4em; }
  .card .blurb { font-size: 1.3em; } .card .how { font-size: 1.1em; color: #cdbf9d; }
  .card .say { font-size: 1.3em; } .card .end { font-size: 1.15em; letter-spacing: 0.2em; text-transform: uppercase; color: #c98b3f; }
  .card-buttons { display: flex; gap: 1.2em; justify-content: center; margin-top: 1.2em; }
  .card button { font: inherit; font-size: 1.1em; letter-spacing: 0.1em; padding: 0.35em 1.2em; cursor: pointer; background: #1c1524; color: #f1e2c0; border: 1px solid #86522a; }
  .card button.sel { border-color: #ffd680; color: #ffd680; box-shadow: 0 0 0.8em rgba(255, 214, 128, 0.35); }
  .card .card-hint { margin: 0.9em 0 0; font-size: 0.85em; letter-spacing: 0.14em; text-transform: uppercase; color: #7d6f66; }
  .card.title { background: rgba(7, 5, 11, 0.5); }
  .card h1 { margin: 0 0 0.3em; font-size: 4em; font-weight: normal; letter-spacing: 0.14em; color: #ffd680; text-shadow: 0 0 0.6em rgba(255, 150, 60, 0.5); text-transform: uppercase; }
  .card table.sheet { margin: 0 auto 0.8em; border-collapse: collapse; font-size: 1.05em; }
  .card table.sheet td { padding: 0.08em 0.9em; text-align: left; } .card table.sheet td:nth-child(2) { color: #ffd680; text-align: right; } .card table.sheet td:nth-child(3) { color: #9fc2ff; font-size: 0.85em; }
  .card.pause .card-in { padding: 1.2em 1.6em 0.9em; width: 92%; max-height: 96%; } .card.pause h2 { font-size: 1.6em; margin-bottom: 0.3em; }
  .card.pause .hows { display: grid; grid-template-columns: 1fr 1fr; gap: 0.1em 1.4em; } .card.pause .how { margin: 0; font-size: 0.74em; line-height: 1.3; text-align: left; }
  .card.pause table.sheet { font-size: 0.92em; margin-bottom: 0.5em; } .card.pause .card-buttons { margin-top: 0.6em; } .card.pause .card-hint { margin-top: 0.5em; }
  .card.pause .card-in, .card.settings .card-in { width: 84%; }
  #debug { position: absolute; top: 6%; left: 50%; transform: translateX(-50%); width: min(92%, 460px); box-sizing: border-box;
    background: rgba(14, 10, 18, 0.94); border: 1px solid #c98b3f; padding: 12px 16px; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  #debug h2 { margin: 0 0 6px; font-size: 14px; color: #ffd680; letter-spacing: 0.1em; text-transform: uppercase; }
  #debug .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  #debug .powers { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; margin: 8px 0; }
  #debug select, #debug input[type=number], #debug button { background: #1c1524; color: #f1e2c0; border: 1px solid #86522a; padding: 3px 6px; font: inherit; }
  #debug input[type=number] { width: 5em; }
  #debug button { cursor: pointer; }
  #debug button:hover { border-color: #ffd680; }
</style>
</head>
<body>
<div id="stage"><div id="frame"><canvas id="game" width="480" height="270"></canvas><div id="ui"></div></div></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
